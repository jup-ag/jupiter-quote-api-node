    "/swap/v2/order": {
      "get": {
        "operationId": "GetOrder",
        "tags": [
          "SwapV2"
        ],
        "summary": "Get Order",
        "description": "Get a swap quote and assembled transaction. This is the default happy path with all Ultra benefits\n(predictive execution, RTSE, Jupiter Beam, gasless, multi-router competition).\n\nWithout optional parameters, all routers compete for the best price (Metis, JupiterZ RFQ, Dflow, OKX).\nSetting `payer` to a wallet different from `taker` restricts routing to Metis.\n",
        "security": [
          {
            "SwapV2_ApiKeyAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/SwapV2_InputMintParameter"
          },
          {
            "$ref": "#/components/parameters/SwapV2_OutputMintParameter"
          },
          {
            "$ref": "#/components/parameters/SwapV2_AmountParameter"
          },
          {
            "name": "taker",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "- The public key of the wallet that will sign the transaction\n- If not provided, the response will contain a quote but no transaction\n- Must be present if you intend to sign and execute the transaction via `/execute`\n",
            "example": "GkwFnmMDvn3HGMpJpWBg8tgJxr3NxNvg3AXxvXVPbRGJ"
          },
          {
            "name": "receiver",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "- The public key of the account that will receive the output tokens\n- Must differ from `taker`\n- Expects a wallet address, not a token account\n- For non-SOL output: tokens are sent to the receiver's associated token account (ATA). If the ATA is not initialised, a create ATA instruction is added to the transaction\n- For SOL output: native SOL is transferred directly to the receiver\n- Does not support destination wSOL token accounts\n"
          },
          {
            "name": "swapMode",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "ExactIn"
              ]
            },
            "description": "- Swap mode. Currently only `ExactIn` is supported.\n"
          },
          {
            "name": "slippageBps",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 10000
            },
            "description": "- Slippage tolerance in basis points (0-10000)\n- If not set, Jupiter automatically determines an appropriate slippage\n",
            "example": 50
          },
          {
            "name": "referralAccount",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "- Address of your referral account for the Jupiter referral project\n- Must be used together with `referralFee`\n- See the [Referral Program](/tool-kits/referral-program) for setup\n"
          },
          {
            "name": "referralFee",
            "in": "query",
            "schema": {
              "type": "number",
              "minimum": 50,
              "maximum": 255
            },
            "description": "- Referral fee in basis points (50-255)\n- Must be used together with `referralAccount`\n",
            "example": 50
          },
          {
            "name": "payer",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "- The public key of an account that will cover gas-related fees (signature fees, priority fees, and rent) on behalf of the taker\n- Has no effect when set equal to `taker`. Must be a different wallet to activate integrator-sponsored gas\n- Enabling this restricts routing to Metis (JupiterZ is disabled when an integrator payer is set)\n",
            "example": "gasTzr94Pmp4Gf8vknQnqxeYxdgwFjbgdJa4msYRpnB"
          },
          {
            "name": "priorityFeeLamports",
            "in": "query",
            "schema": {
              "type": "number"
            },
            "description": "- Priority fee in lamports\n- If not set, Jupiter automatically determines an appropriate priority fee\n- Setting this overrides the automatic optimisation\n"
          },
          {
            "name": "jitoTipLamports",
            "in": "query",
            "schema": {
              "type": "number"
            },
            "description": "- Jito MEV tip in lamports for faster block inclusion\n"
          },
          {
            "name": "broadcastFeeType",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "maxCap",
                "exactFee"
              ]
            },
            "description": "- Fee cap strategy: `maxCap` treats the fee as a maximum, `exactFee` uses the exact amount\n- Ignored if neither `priorityFeeLamports` nor `jitoTipLamports` are set\n"
          },
          {
            "name": "excludeRouters",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "- Comma-separated list of routers to exclude\n- Available routers: `metis`, `jupiterz`, `dflow`, `okx`\n",
            "example": "jupiterz,dflow"
          },
          {
            "name": "excludeDexes",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "- Comma-separated list of DEXes to exclude from the Metis router\n- **Important**: This only affects the Metis router, not other routers\n- For example: `excludeDexes=Raydium,Orca+V2,Meteora+DLMM`\n"
          }
        ],
        "responses": {
          "200": {
            "description": "Quote with optional assembled transaction",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "mode": {
                      "type": "string",
                      "description": "\"ultra\" or \"manual\" based on parameters used"
                    },
                    "inputMint": {
                      "type": "string"
                    },
                    "outputMint": {
                      "type": "string"
                    },
                    "inAmount": {
                      "type": "string"
                    },
                    "outAmount": {
                      "type": "string"
                    },
                    "inUsdValue": {
                      "type": "number"
                    },
                    "outUsdValue": {
                      "type": "number"
                    },
                    "priceImpact": {
                      "type": "number",
