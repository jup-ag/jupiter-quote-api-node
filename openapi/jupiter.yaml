                    "errorCode": {
                      "type": "number",
                      "description": "Present when `taker` is defined and `transaction` is the empty string. The router quoted a price but could not build a transaction. Match on `router` + `errorCode` to identify the error.\n\nAggregator routers (router is metis, dflow, okx):\n- 1: Insufficient funds\n- 2: Insufficient SOL for gas\n- 3: Swap below minimum for gasless\n\nJupiterZ router (router is jupiterz):\n- 1: Insufficient balance to fund the swap\n- 2: Missing associated token account\n- 3: Quote could not be built into a transaction\n"
                    },
                    "errorMessage": {
                      "type": "string",
                      "description": "Human-readable error description. Present when `taker` is defined and `transaction` is the empty string.\nMatch on `router` + `errorCode` instead of this string, as the message text may be parameterised.\n"
                    },
                    "error": {
                      "type": "string",
                      "description": "Duplicate of errorMessage for backwards compatibility"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Bad request",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "requestId": {
                      "type": "string"
                    },
                    "error": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        }
      },
      "servers": [
        {
          "url": "https://api.jup.ag"
        }
      ]
    },
    "/swap/v2/build": {
      "get": {
        "operationId": "GetBuild",
        "tags": [
          "SwapV2"
        ],
        "summary": "Build Transaction",
        "description": "Get a swap quote with raw instructions for building custom transactions.\nThis is the advanced path for integrators who need full transaction control\n(add custom instructions, CPI, custom payer).\n\nYou are responsible for assembling the transaction, signing, and sending via your own RPC.\nThe `/execute` endpoint is not available for `/build` transactions.\n\nRouting is Metis only. No swap fees are charged by Jupiter.\n",
        "security": [
          {
            "SwapV2_ApiKeyAuth": []
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/SwapV2_InputMintParameter"
          },
          {
            "$ref": "#/components/parameters/SwapV2_OutputMintParameter"
          },
          {
            "$ref": "#/components/parameters/SwapV2_AmountParameter"
          },
          {
            "name": "taker",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Public key of the user initiating the swap.",
            "example": "GkwFnmMDvn3HGMpJpWBg8tgJxr3NxNvg3AXxvXVPbRGJ"
          },
          {
            "$ref": "#/components/parameters/SwapV2_BuildSlippageBpsParameter"
          },
          {
            "name": "mode",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "fast"
              ]
            },
            "description": "Quoting mode. \"fast\" trades quote optimality for reduced latency.\n"
          },
          {
            "name": "dexes",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "- Comma-separated list of DEXes to restrict routing to.\n- Mutually exclusive with excludeDexes.\n"
          },
          {
            "name": "excludeDexes",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "- Comma-separated list of DEXes to exclude.\n- Mutually exclusive with dexes.\n"
          },
          {
            "name": "platformFeeBps",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 10000
            },
            "description": "Platform fee in basis points. If positive, feeAccount is required.\n",
            "example": 50
          },
          {
            "name": "feeAccount",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Token account to collect platform fees. Required if platformFeeBps is positive."
          },
          {
            "name": "maxAccounts",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 64
            },
            "description": "Maximum number of accounts for the swap route. Defaults to 64."
          },
          {
            "name": "payer",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Account that pays transaction fees and rent. Defaults to taker when not passed in."
          },
          {
            "name": "wrapAndUnwrapSol",
            "in": "query",
            "schema": {
              "type": "boolean"
            },
            "description": "Whether to wrap/unwrap SOL. Defaults to true."
          },
          {
            "name": "destinationTokenAccount",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "- SPL token account to receive output tokens.\n- Mutually exclusive with nativeDestinationAccount.\n"
          },
          {
            "name": "nativeDestinationAccount",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "- Native SOL account to receive output.\n- Mutually exclusive with destinationTokenAccount.\n"
          },
          {
            "name": "blockhashSlotsToExpiry",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 300
            },
            "description": "Number of slots until the blockhash expires. Defaults to 150."
          },
          {
            "name": "tipAmount",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "SOL tip amount in lamports. Adds a tip instruction for use with /submit. The tip payer is the taker (or payer if specified).",
            "required": false
          },
          {
            "$ref": "#/components/parameters/SwapV2_BuildComputeUnitPricePercentileParameter"
          },
          {
            "name": "forJitoBundle",
            "in": "query",
            "schema": {
              "type": "boolean",
              "default": false
            },
            "description": "Set to `true` if the transaction will be submitted as part of a Jito bundle.\nThis excludes DEXes that are incompatible with Jito bundles.\n"
          }
        ],
        "responses": {
          "200": {
            "description": "Quote with raw swap instructions",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "inputMint": {
                      "type": "string"
                    },
                    "outputMint": {
                      "type": "string"
                    },
                    "inAmount": {
                      "type": "string"
                    },
                    "outAmount": {
                      "type": "string"
                    },
                    "otherAmountThreshold": {
                      "type": "string",
                      "description": "Minimum output amount after slippage"
                    },
                    "swapMode": {
                      "type": "string"
                    },
                    "slippageBps": {
                      "type": "number"
                    },
                    "routePlan": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/SwapV2_RoutePlanStep"
                      }
                    },
                    "computeBudgetInstructions": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/SwapV2_Instruction"
                      },
                      "description": "Compute unit price instruction (does not include compute unit limit)"
                    },
                    "setupInstructions": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/SwapV2_Instruction"
                      },
                      "description": "Pre-swap setup instructions (e.g. create ATAs)"
                    },
                    "swapInstruction": {
                      "$ref": "#/components/schemas/SwapV2_Instruction"
                    },
                    "cleanupInstruction": {
                      "$ref": "#/components/schemas/SwapV2_Instruction",
                      "nullable": true,
                      "description": "Post-swap cleanup instruction"
                    },
                    "otherInstructions": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/SwapV2_Instruction"
                      }
                    },
                    "tipInstruction": {
                      "nullable": true,
                      "allOf": [
                        {
                          "$ref": "#/components/schemas/SwapV2_Instruction"
                        }
                      ]
                    },
                    "addressesByLookupTableAddress": {
                      "type": "object",
                      "additionalProperties": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      },
                      "nullable": true,
                      "description": "Address lookup table mappings for v0 transactions"
                    },
                    "blockhashWithMetadata": {
                      "type": "object",
                      "properties": {
                        "blockhash": {
                          "type": "array",
                          "items": {
                            "type": "number"
                          },
                          "description": "Blockhash as byte array"
                        },
                        "lastValidBlockHeight": {
                          "type": "number"
                        },
                        "fetchedAt": {
                          "type": "string",
                          "description": "ISO 8601 timestamp of when the blockhash was fetched"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Bad request",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        }
      },
      "servers": [
        {
          "url": "https://api.jup.ag"
        }
      ]
    },
    "/swap/v2/execute": {
      "post": {
        "operationId": "PostExecute",
        "tags": [
          "SwapV2"
        ],
        "summary": "Execute Transaction",
        "description": "Execute a signed transaction from `/order`. Handles transaction landing, confirmation, and retry.\n\nOnly available for transactions obtained via `/order`. Transactions built via `/build` must be\nsent through your own RPC.\n",
        "security": [
          {
            "SwapV2_ApiKeyAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "signedTransaction",
                  "requestId"
                ],
                "properties": {
                  "signedTransaction": {
                    "type": "string",
                    "description": "Base64-encoded signed transaction"
                  },
                  "requestId": {
                    "type": "string",
                    "description": "The requestId from the /order response"
                  },
                  "lastValidBlockHeight": {
                    "type": "string",
                    "description": "Optional block height for nonce validation"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Execution result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string",
                      "enum": [
                        "Success",
                        "Failed"
                      ]
                    },
                    "signature": {
                      "type": "string",
                      "description": "Transaction signature"
                    },
                    "slot": {
                      "type": "string",
                      "description": "Confirmed slot"
                    },
                    "error": {
                      "type": "string",
                      "description": "Error message (present if Failed)"
                    },
                    "code": {
                      "type": "number",
                      "description": "- Error code. 0 = success.\n- Ultra: -1 (missing cached order), -2 (invalid signed tx), -3 (invalid message bytes).\n- Aggregator: -1000 (failed to land), -1001 (unknown), -1002 (invalid tx), -1003 (not fully signed), -1004 (invalid block height).\n- RFQ: -2000 (failed to land), -2001 (unknown), -2002 (invalid payload), -2003 (quote expired), -2004 (swap rejected).\n"
                    },
                    "totalInputAmount": {
                      "type": "string",
                      "description": "Total input token amount deducted from the user's wallet, including the fee if feeMint is the input mint"
                    },
                    "totalOutputAmount": {
                      "type": "string",
                      "description": "Final output token amount reflected in the user's wallet, after any fee collected in the output mint"
                    },
                    "inputAmountResult": {
                      "type": "string",
                      "description": "Input amount that went into the swap route, after any fee collected in the input mint"
                    },
                    "outputAmountResult": {
                      "type": "string",
                      "description": "Output amount produced by the swap route, before any fee collected in the output mint"
                    },
                    "swapEvents": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/SwapV2_SwapEvent"
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Bad request",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    },
                    "code": {
                      "type": "number"
                    }
                  }
                }
              }
            }
          },
          "500": {
            "description": "Internal server error",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "signature": {
                      "type": "string"
                    },
                    "error": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        }
      },
      "servers": [
        {
          "url": "https://api.jup.ag"
        }
      ]
    },
