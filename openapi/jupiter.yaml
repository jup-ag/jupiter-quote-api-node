      "Studio_CreateDBCTransactionRequestBody": {
        "type": "object",
        "required": [
          "buildCurveByMarketCapParam",
          "antiSniping",
          "fee",
          "tokenName",
          "tokenSymbol",
          "tokenImageContentType",
          "creator"
        ],
        "properties": {
          "buildCurveByMarketCapParam": {
            "type": "object",
            "required": [
              "quoteMint",
              "initialMarketCap",
              "migrationMarketCap",
              "tokenQuoteDecimal",
              "lockedVestingParam"
            ],
            "properties": {
              "quoteMint": {
                "type": "string",
                "description": "- Quote mint address\n- Either USDC, SOL, or JUP\n",
                "example": "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
              },
              "initialMarketCap": {
                "type": "number",
                "description": "- Initial market cap in quote token units\n- 16000 passed in = 16000 USDC/SOL/JUP initial market cap\n",
                "example": 16000
              },
              "migrationMarketCap": {
                "type": "number",
                "description": "- Migration market cap in quote token units\n- 69000 passed in = 69000 USDC/SOL/JUP migration market cap\n",
                "example": 69000
              },
              "tokenQuoteDecimal": {
                "type": "number",
                "enum": [
                  6,
                  9
                ],
                "description": "- Token quote decimal places\n"
              },
              "lockedVestingParam": {
                "type": "object",
                "required": [
                  "totalLockedVestingAmount",
                  "cliffUnlockAmount",
                  "numberOfVestingPeriod",
                  "totalVestingDuration",
                  "cliffDurationFromMigrationTime"
                ],
                "properties": {
                  "totalLockedVestingAmount": {
                    "type": "number",
                    "description": "- Total locked vesting amount of tokens (0% to 80% of total supply)\n"
                  },
                  "cliffUnlockAmount": {
                    "type": "number",
                    "description": "- Amount of tokens unlocked at cliff\n"
                  },
                  "numberOfVestingPeriod": {
                    "type": "number",
                    "enum": [
                      0,
                      6,
                      12,
                      183,
                      365
                    ],
                    "description": "- Number of vesting periods in days (183/365) or months (6/12)\n"
                  },
                  "totalVestingDuration": {
                    "type": "number",
                    "enum": [
                      0,
                      15552000,
                      15811200,
                      31536000
                    ],
                    "description": "- Total vesting duration in seconds\n"
                  },
                  "cliffDurationFromMigrationTime": {
                    "type": "number",
                    "enum": [
                      0,
                      15552000,
                      15811200,
                      31536000
                    ],
                    "description": "- Cliff duration from migration time in seconds\n"
                  }
                }
              }
            }
          },
          "antiSniping": {
            "type": "boolean",
            "description": "- Enable anti-sniping protection\n- Apply an additional swap fee immediately after launch to discourage bots\n- Starts at 99% and decreases 1% linearly over a randomized period\n"
          },
          "fee": {
            "type": "object",
            "description": "- Fee configuration parameters\n- If not provided, the default fee will be 100 basis points (1%)\n",
            "properties": {
              "totalDuration": {
                "type": "number",
                "enum": [
                  60,
                  120,
                  180,
                  240,
                  300
                ],
                "description": "Total duration for fee schedule"
              },
              "baseFeeMode": {
                "type": "string",
                "enum": [
                  "linear",
                  "exponential"
                ],
                "description": "Base fee mode for fee scheduler"
              },
              "feeBps": {
                "type": "number",
                "enum": [
                  100,
                  200
                ],
                "description": "Ending fee in basis points (100 or 200)",
                "default": 100
              }
            },
            "required": [
              "feeBps"
            ]
          },
          "isLpLocked": {
            "type": "boolean",
            "description": "- Whether LP tokens should be locked\n- If enabled, 50% of graduated LP unlocks after 1 year\n- Useful for creators to strategize in the long term\n",
            "default": true
          },
          "tokenName": {
            "type": "string",
            "minLength": 1
          },
          "tokenSymbol": {
            "type": "string",
            "minLength": 1
          },
          "tokenImageContentType": {
            "type": "string",
            "description": "- Token image content type\n",
            "enum": [
              "image/jpeg",
              "image/png",
              "image/gif",
              "image/webp"
            ]
          },
          "creator": {
            "type": "string",
            "description": "- Creator wallet public key\n"
          }
        }
      },
