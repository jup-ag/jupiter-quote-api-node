          "isAssociatedTokenAccount": {
            "type": "boolean",
            "description": "Whether this is an associated token account"
          },
          "decimals": {
            "type": "number",
            "description": "Number of decimal places for the token"
          },
          "programId": {
            "type": "string",
            "description": "The token program ID"
          }
        },
        "required": [
          "account",
          "amount",
          "uiAmount",
          "uiAmountString",
          "isFrozen",
          "isAssociatedTokenAccount",
          "decimals",
          "programId"
        ]
      }
    },
    "parameters": {
      "LendBorrow_market": {
        "name": "market",
        "in": "query",
        "description": "Lend market identifier. Defaults to `main`.",
        "required": false,
        "style": "form",
        "explode": true,
        "schema": {
          "$ref": "#/components/schemas/LendBorrow_Market"
        }
      },
      "SwapV1_InputMintParameter": {
        "name": "inputMint",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "SwapV1_OutputMintParameter": {
        "name": "outputMint",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string"
        }
      },
      "SwapV1_AmountParameter": {
        "name": "amount",
        "description": "- Raw amount to swap (before decimals)\n- Input Amount if `SwapMode=ExactIn`\n- Output Amount if `SwapMode=ExactOut`\n",
        "in": "query",
        "required": true,
        "schema": {
          "type": "integer",
          "format": "uint64"
        }
      },
      "SwapV1_SlippageParameter": {
        "name": "slippageBps",
        "description": "- Default: 50\n- This is threshold denoted in basis points.\n- If exact in and output amount exceeds the threshold, then the swap transaction will fail.\n",
        "in": "query",
        "schema": {
          "type": "integer",
          "format": "uint16",
          "default": 50
        }
      },
      "SwapV1_SwapModeParameter": {
        "name": "swapMode",
        "description": "- ExactOut is for supporting use cases where you need an exact output amount\n- In the case of `ExactIn`, the slippage is on the output token\n- In the case of `ExactOut`, the slippage is on the input token\n- Not all AMMs support `ExactOut`: Currently only Orca Whirlpool, Raydium CLMM, Raydium CPMM\n- We do not recommend using `ExactOut` for most use cases\n",
        "in": "query",
        "schema": {
          "type": "string",
          "enum": [
            "ExactIn",
            "ExactOut"
          ],
          "default": "ExactIn"
        }
      },
      "SwapV1_DexesParameter": {
        "name": "dexes",
        "description": "- Multiple DEXes can be pass in by comma separating them\n- For example: `dexes=Raydium,Orca+V2,Meteora+DLMM`\n- If a DEX is indicated, the route will **only use** that DEX\n- Full list of DEXes here using the `/program-id-to-label` endpoint\n",
        "in": "query",
        "schema": {
          "type": "array",
          "items": {
            "type": "string"
          }
        }
      },
      "SwapV1_ExcludeDexesParameter": {
        "name": "excludeDexes",
        "description": "- Multiple DEXes can be pass in by comma separating them\n- For example: `excludeDexes=Raydium,Orca+V2,Meteora+DLMM`\n- If a DEX is indicated, the route will **not use** that DEX\n- Full list of DEXes here using the `/program-id-to-label` endpoint\n",
        "in": "query",
        "schema": {
          "type": "array",
          "items": {
            "type": "string"
          }
        }
      },
      "SwapV1_RestrictIntermediateTokensParameter": {
        "name": "restrictIntermediateTokens",
        "description": "- Restrict intermediate tokens within a route to a set of more stable tokens\n- This will help to reduce exposure to potential high slippage routes\n",
        "in": "query",
        "schema": {
          "type": "boolean",
          "default": true
        }
      },
      "SwapV1_OnlyDirectRoutesParameter": {
        "name": "onlyDirectRoutes",
        "description": "- Direct route limits Jupiter routing to single hop routes only\n- This may result in worse routes\n",
        "in": "query",
        "schema": {
          "type": "boolean",
          "default": false
        }
      },
      "SwapV1_AsLegacyTransactionParameter": {
        "name": "asLegacyTransaction",
        "description": "- Instead of using versioned transaction, this will use the legacy transaction\n",
        "in": "query",
        "schema": {
          "type": "boolean",
          "default": false
        }
      },
      "SwapV1_MaxAccountsParameter": {
        "name": "maxAccounts",
        "description": "- Rough estimate of the max accounts to be used for the quote\n- Useful if composing your own transaction or to be more precise in resource accounting for better routes\n",
        "in": "query",
        "schema": {
          "type": "integer",
          "format": "uint64",
          "default": 64
        }
      },
      "SwapV1_PlatformFeeBpsParameter": {
        "name": "platformFeeBps",
        "description": "- Take fees in basis points\n- If `platformFeeBps` is passed in, the `feeAccount` in `/swap` must be passed as well\n",
        "in": "query",
        "schema": {
          "type": "integer",
          "format": "uint16"
        }
      },
      "SwapV1_InstructionVersion": {
        "name": "instructionVersion",
        "description": "- The version of instruction to use in the swap program\n",
        "in": "query",
        "schema": {
          "type": "string",
          "enum": [
            "V1",
            "V2"
          ],
          "default": "V1"
        }
      },
      "SwapV1_DynamicSlippage": {
        "name": "dynamicSlippage",
        "description": "- No longer applicable, only required to pass in via `/swap` endpoint\n",
        "in": "query",
        "schema": {
          "type": "boolean",
          "default": false
        }
      },
      "SwapV1_ForJitoBundle": {
        "name": "forJitoBundle",
        "description": "Set to `true` if the quote will be used in a Jito bundle. This excludes DEXes that are incompatible with Jito bundles (e.g. HumidiFi).\n",
        "in": "query",
        "schema": {
          "type": "boolean",
          "default": false
        }
      },
      "SwapV2_BuildSlippageBpsParameter": {
        "name": "slippageBps",
        "in": "query",
        "schema": {
          "anyOf": [
            {
              "type": "string",
              "enum": [
                "rtse"
              ]
            },
            {
              "type": "number",
              "minimum": 0,
              "maximum": 10000
            }
          ],
          "default": 50
        },
        "description": "Slippage tolerance in basis points. Defaults to 50."
      },
      "SwapV2_BuildComputeUnitPricePercentileParameter": {
        "name": "computeUnitPricePercentile",
        "in": "query",
        "schema": {
          "anyOf": [
            {
              "type": "string",
              "enum": [
                "medium",
                "high",
                "veryHigh"
              ]
            },
            {
              "type": "integer",
              "minimum": 0,
              "maximum": 10000
            }
          ]
        },
        "description": "Percentile of compute unit price to use. Named levels: \"medium\" (25th), \"high\" (50th), \"veryHigh\" (75th), or a number 0-10000 in basis points."
      },
      "SwapV2_InputMintParameter": {
        "name": "inputMint",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string"
        },
        "description": "The mint address of the input token",
        "example": "So11111111111111111111111111111111111111112"
      },
      "SwapV2_OutputMintParameter": {
        "name": "outputMint",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string"
        },
        "description": "The mint address of the output token",
        "example": "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
      },
      "SwapV2_AmountParameter": {
        "name": "amount",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string"
        },
        "description": "The amount to swap in the smallest unit of the input token",
        "example": "1000000000"
      }
    },
