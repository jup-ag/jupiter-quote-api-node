                    },
                    "swapUsdValue": {
                      "type": "number"
                    },
                    "otherAmountThreshold": {
                      "type": "string",
                      "description": "Minimum output amount after slippage"
                    },
                    "swapMode": {
                      "type": "string"
                    },
                    "slippageBps": {
                      "type": "number"
                    },
                    "priceImpactPct": {
                      "type": "string",
                      "description": "Deprecated: decimal price impact ratio. Use priceImpact divided by 100 instead.",
                      "deprecated": true
                    },
                    "routePlan": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/SwapV2_RoutePlanStep"
                      }
                    },
                    "referralAccount": {
                      "type": "string"
                    },
                    "feeMint": {
                      "type": "string"
                    },
                    "feeBps": {
                      "type": "number",
                      "description": "Total fee rate charged for the swap in basis points. This includes the Jupiter platform fee plus any additional charges, such as gasless support cost recoup."
                    },
                    "platformFee": {
                      "$ref": "#/components/schemas/SwapV2_PlatformFee"
                    },
                    "signatureFeeLamports": {
                      "type": "number"
                    },
                    "signatureFeePayer": {
                      "type": "string",
                      "nullable": true
                    },
                    "prioritizationFeeLamports": {
                      "type": "number",
                      "description": "Includes priority fees and tips (Jito, Nozomi)"
                    },
                    "prioritizationFeePayer": {
