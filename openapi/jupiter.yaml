      "get": {
        "summary": "shield",
        "description": "Request for token information and warnings of mints\n",
        "security": [
          {
            "Ultra_ApiKeyAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "warnings": {
                      "type": "object",
                      "additionalProperties": {
                        "description": "- Token mint address as key\n",
                        "type": "array",
                        "items": {
                          "type": "object",
                          "properties": {
                            "type": {
                              "type": "string",
                              "enum": [
                                "NOT_VERIFIED",
                                "LOW_LIQUIDITY",
                                "NOT_SELLABLE",
                                "LOW_ORGANIC_ACTIVITY",
                                "HAS_MINT_AUTHORITY",
                                "HAS_FREEZE_AUTHORITY",
                                "HAS_PERMANENT_DELEGATE",
                                "NEW_LISTING",
                                "VERY_LOW_TRADING_ACTIVITY",
                                "HIGH_SUPPLY_CONCENTRATION",
                                "NON_TRANSFERABLE",
                                "MUTABLE_TRANSFER_FEES",
                                "SUSPICIOUS_DEV_ACTIVITY",
                                "SUSPICIOUS_TOP_HOLDER_ACTIVITY",
                                "HIGH_SINGLE_OWNERSHIP",
                                "{}%_TRANSFER_FEES"
                              ],
                              "description": "- Type of warning for the token\n"
                            },
                            "message": {
