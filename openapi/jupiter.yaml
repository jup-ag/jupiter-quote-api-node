      "SwapV1_SwapRequest": {
        "type": "object",
        "required": [
          "userPublicKey",
          "quoteResponse"
        ],
        "properties": {
          "userPublicKey": {
            "type": "string"
          },
          "payer": {
            "description": "- Allow a custom payer to pay for the transaction fees and rent of token accounts\n- Note that users can close their ATAs elsewhere and have you reopen them again, your fees should account for this\n",
            "type": "string"
          },
          "wrapAndUnwrapSol": {
            "description": "- To automatically wrap/unwrap SOL in the transaction, as WSOL is an SPL token while native SOL is not\n- When true and input mint is SOL, it will wrap the SOL amount to WSOL and swap\n- When true and output mint is SOL, it will unwrap the WSOL back to SOL\n- When true, the wSOL token account is always closed after the transaction, regardless of whether SOL is the input or output mint\n- When false and input mint is SOL, it will use existing WSOL amount to swap\n- When false and output mint is SOL, it will not unwrap the WSOL to SOL\n- To set this parameter to false, you need to have the WSOL token account initialized\n",
            "type": "boolean",
            "default": true
          },
          "useSharedAccounts": {
            "description": "- The default is determined dynamically by the routing engine, allowing us to optimize for compute units, etc\n- This enables the usage of shared program accounts, this is essential as complex routing will require multiple intermediate token accounts which the user might not have\n- If true, you do not need to handle the creation of intermediate token accounts for the user\n- Do note, shared accounts route will fail on some new AMMs (low liquidity token)\n",
            "type": "boolean"
          },
          "feeAccount": {
            "description": "- An initialized token account that will be used to collect fees\n- The mint of the token account **can only be either the input or output mint of the swap**\n- Swap API no longer requires the use of the Referral Program\n- If `platformFeeBps` is passed in `/quote`, the `feeAccount` must be passed as well\n",
            "type": "string"
          },
          "trackingAccount": {
            "description": "- Specify any public key that belongs to you to track the transactions\n- Useful for integrators to get all the swap transactions from this public key\n- Query the data using a block explorer like Solscan/SolanaFM or query like Dune/Flipside\n",
            "type": "string"
          },
          "prioritizationFeeLamports": {
            "description": "- To specify a level or amount of additional fees to prioritize the transaction\n- It can be used for EITHER priority fee OR Jito tip (not both at the same time)\n- If you want to include both, you will need to use `/swap-instructions` to add both at the same time\n- Defaults to `auto`, but preferred to use `priorityLevelWithMaxLamports` as it may be more accurate when accounting local fee market\n- Fixed lamports can be passed in as an integer in the `prioritizationFeeLamports` parameter\n",
            "oneOf": [
              {
                "$ref": "#/components/schemas/SwapV1_PriorityLevelWithMaxLamports"
              },
              {
                "$ref": "#/components/schemas/SwapV1_JitoTipLamports"
              },
              {
                "$ref": "#/components/schemas/SwapV1_JitoTipLamportsWithPayer"
              }
            ]
          },
          "asLegacyTransaction": {
            "description": "- Builds a legacy transaction rather than the default versioned transaction\n- Used together with `asLegacyTransaction` in `/quote`, otherwise the transaction might be too large\n",
            "type": "boolean",
            "default": false
          },
          "destinationTokenAccount": {
            "description": "- Public key of a token account that will be used to receive the token out of the swap\n- If not provided, the signer's token account will be used\n- If provided, we assume that the token account is already initialized\n- `destinationTokenAccount` and `nativeDestinationAccount` are mutually exclusive\n",
            "type": "string"
          },
          "nativeDestinationAccount": {
            "description": "- Public key of an account that will be used to receive the native SOL token out of the swap\n- If not provided, the swap will default unwrap the WSOL and transfer the native SOL to the swap authority account\n- If provided, we will unwrap the WSOL and transfer the native SOL to the account\n- Only works if the output mint is SOL, is using the V2 instructions and the account passed in is not owned by token program\n- When sending native SOL to a new account, you must swap at least enough to cover the rent required to create it.\n- `destinationTokenAccount` and `nativeDestinationAccount` are mutually exclusive\n",
            "type": "string"
          },
          "dynamicComputeUnitLimit": {
            "description": "- When enabled, simulates the swap to provide an accurate compute unit limit in the transaction\n- This incurs one extra RPC call to simulate\n- Recommended for all normal flows — reduces priority fees needed and improves transaction landing\n",
            "type": "boolean",
            "default": false
          },
          "skipUserAccountsRpcCalls": {
            "description": "- When enabled, it will not do any additional RPC calls to check on required accounts\n- The returned swap transaction will still attempt to create required accounts regardless if it exists or not\n",
            "type": "boolean",
            "default": false
          },
          "dynamicSlippage": {
            "description": "- When enabled, it estimates slippage and apply it in the swap transaction directly, overwriting the `slippageBps` parameter in the quote response.\n- This is no longer maintained, we are focusing efforts on RTSE on Ultra Swap API\n",
            "type": "boolean",
            "default": false
          },
          "computeUnitPriceMicroLamports": {
            "description": "- To use an exact compute unit price to calculate priority fee\n- `computeUnitLimit (1400000) * computeUnitPriceMicroLamports`\n- We recommend using `prioritizationFeeLamports` and `dynamicComputeUnitLimit` instead of passing in your own compute unit price\n",
            "type": "integer",
            "format": "uint64"
          },
          "blockhashSlotsToExpiry": {
            "description": "- Pass in the number of slots we want the transaction to be valid for\n- Example: If you pass in 10 slots, the transaction will be valid for ~400ms * 10 = approximately 4 seconds before it expires\n",
            "type": "integer",
            "format": "uint8"
          },
          "quoteResponse": {
            "$ref": "#/components/schemas/SwapV1_QuoteResponse"
          }
        }
      },
      "SwapV1_SwapResponse": {
        "type": "object",
        "properties": {
          "swapTransaction": {
            "type": "string"
