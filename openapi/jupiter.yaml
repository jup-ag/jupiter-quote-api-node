    "/trigger/v2/auth/challenge": {
      "post": {
        "summary": "Request authentication challenge",
        "description": "Request a challenge to sign with your wallet. Use `message` for standard wallets\nor `transaction` for hardware wallets that only support transaction signing.\nChallenges expire after 5 minutes.\n",
        "security": [
          {
            "TriggerV2_ApiKeyAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "walletPubkey": {
                    "type": "string",
                    "description": "Your Solana wallet public key"
                  },
                  "type": {
                    "type": "string",
                    "enum": [
                      "message",
                      "transaction"
                    ],
                    "description": "Challenge type. Use `transaction` for hardware wallets."
                  }
                },
                "required": [
                  "walletPubkey",
                  "type"
                ]
              },
              "example": {
                "walletPubkey": "BQ72nSv9f3PRyRKCBnHLVrerrv37CYTHm5h3s9VSGQDV",
                "type": "message"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Challenge for wallet signing",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "type": "string",
                          "enum": [
                            "message"
                          ]
                        },
                        "challenge": {
                          "type": "string",
                          "description": "Message to sign"
                        }
                      },
                      "required": [
                        "type",
                        "challenge"
                      ]
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "type": "string",
                          "enum": [
                            "transaction"
                          ]
                        },
                        "transaction": {
                          "type": "string",
                          "description": "Base64-encoded transaction with memo instruction"
                        }
                      },
                      "required": [
                        "type",
                        "transaction"
                      ]
                    }
                  ]
                },
                "example": {
                  "type": "message",
                  "challenge": "Sign this message to authenticate with Jupiter Trigger Order API: abc123..."
                }
              }
            }
          },
          "400": {
            "description": "Invalid request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TriggerV2_ErrorResponse"
                }
              }
            }
          }
        },
        "tags": [
          "TriggerV2"
        ]
      },
      "servers": [
        {
          "url": "https://api.jup.ag"
        }
      ]
    },
    "/trigger/v2/auth/verify": {
      "post": {
        "summary": "Verify signed challenge and receive JWT",
        "description": "Submit the signed challenge to receive a JWT token valid for 24 hours.\nInclude the JWT in all subsequent authenticated requests via the `Authorization: Bearer` header.\n",
        "security": [
          {
            "TriggerV2_ApiKeyAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "type": "object",
                    "title": "MessageVerification",
                    "properties": {
                      "type": {
                        "type": "string",
                        "enum": [
                          "message"
                        ]
                      },
                      "walletPubkey": {
                        "type": "string"
                      },
                      "signature": {
                        "type": "string",
                        "description": "Base58-encoded signature"
                      }
                    },
                    "required": [
                      "type",
                      "walletPubkey",
                      "signature"
                    ]
                  },
                  {
                    "type": "object",
                    "title": "TransactionVerification",
                    "properties": {
                      "type": {
                        "type": "string",
                        "enum": [
                          "transaction"
                        ]
                      },
                      "walletPubkey": {
                        "type": "string"
                      },
                      "signedTransaction": {
                        "type": "string",
                        "description": "Base64-encoded signed transaction"
                      }
                    },
                    "required": [
                      "type",
                      "walletPubkey",
                      "signedTransaction"
                    ]
                  }
                ]
              },
              "example": {
                "type": "message",
                "walletPubkey": "BQ72nSv9f3PRyRKCBnHLVrerrv37CYTHm5h3s9VSGQDV",
                "signature": "5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d..."
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "JWT token",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "token": {
                      "type": "string",
                      "description": "JWT token (24h TTL)"
                    }
                  },
                  "required": [
                    "token"
                  ]
                },
                "example": {
                  "token": "eyJhbGciOiJIUzI1NiIs..."
                }
              }
            }
          },
          "400": {
            "description": "Invalid request body or expired challenge",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TriggerV2_ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "Invalid signature",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TriggerV2_ErrorResponse"
                }
              }
            }
          }
        },
        "tags": [
          "TriggerV2"
        ]
      },
      "servers": [
        {
          "url": "https://api.jup.ag"
        }
      ]
    },
