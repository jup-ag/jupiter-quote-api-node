    "/send/v1/craft-send": {
      "post": {
        "summary": "craft-send",
        "description": "Request for a base64-encoded unsigned Send transaction\n",
        "security": [
          {
            "Send_ApiKeyAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "inviteSigner",
                  "sender",
                  "amount"
                ],
                "properties": {
                  "inviteSigner": {
                    "type": "string",
                    "description": "- Public key address generated from the hash of the invite code\n- Do note that, the invite code requires to be generated client side, [refer to docs](/docs/send)\n- Please handle invite code and secret key with highest security as user funds are involved\n"
                  },
                  "sender": {
                    "type": "string",
                    "description": "- Public key address of the sender\n- This address will be funding the amount to be sent and the token accounts involved\n"
                  },
                  "amount": {
                    "type": "string",
                    "description": "- Amount in atomic value (before decimals)\n- E.g. to send 1 USDC is equivalent of `amount='1000000'`\n- Do note that there will be additional SOL amount being used in the transaction for transaction fees and token accounts\n"
                  },
                  "mint": {
                    "type": "string",
                    "description": "- Defaults to WSOL mint\n- Only pass in this parameter with other mint when required\n"
                  }
                }
              },
              "example": {
                "inviteSigner": "7nE9GJoYHNmtaQvTQpota3KV2oz4pQ2dA6nvYK8EUJHV",
                "sender": "BQ72nSv9f3PRyRKCBnHLVrerrv37CYTHm5h3s9VSGQDV",
                "amount": "1000000",
                "mint": "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "tx",
                    "expiry",
                    "totalFeeLamports"
                  ],
                  "properties": {
                    "tx": {
                      "type": "string",
                      "description": "- Base64-encoded unsigned Send transaction\n"
                    },
                    "expiry": {
                      "type": "string",
                      "description": "- Unix timestamp of when the invite will expire\n- Expired invites will automatically clawback to sender\n"
                    },
                    "totalFeeLamports": {
                      "type": "string",
                      "description": "- Amount of fees required for network's transaction fee and token accounts\n"
                    }
                  }
                },
                "example": {
                  "tx": "AQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAEN...",
                  "expiry": "2025-03-22T10:30:00.000Z",
                  "totalFeeLamports": "5000"
                }
              }
            }
          },
          "400": {
            "description": "Bad request body",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error"
                  ]
                }
              }
            }
          },
          "500": {
            "description": "Internal error",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error"
                  ]
                }
              }
            }
          }
        },
        "tags": [
          "Send"
        ]
      },
      "servers": [
        {
          "url": "https://api.jup.ag"
        }
      ]
    },
