    "/trigger/v2/deposit/craft": {
      "post": {
        "summary": "Craft deposit transaction",
        "description": "Build an unsigned transaction to deposit tokens from your wallet into your vault.\nThe vault address is automatically resolved from your JWT token.\n",
        "security": [
          {
            "TriggerV2_ApiKeyAuth": [],
            "TriggerV2_BearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "inputMint": {
                    "type": "string",
                    "description": "Mint address of the token to deposit"
                  },
                  "outputMint": {
                    "type": "string",
                    "description": "Mint address of the desired output token"
                  },
                  "userAddress": {
                    "type": "string",
                    "description": "Your wallet public key"
                  },
                  "amount": {
                    "type": "string",
                    "description": "Amount in smallest unit (e.g. lamports for SOL)"
                  },
                  "orderType": {
                    "type": "string",
                    "enum": [
                      "price",
                      "dca"
                    ],
                    "description": "Order type for the deposit. Use price for price trigger orders, or dca for dollar-cost averaging orders."
                  },
                  "orderSubType": {
                    "type": "string",
                    "enum": [
                      "single",
                      "oco",
                      "otoco"
                    ],
                    "description": "Required when orderType is price (single for standalone orders, oco for OCO orders, otoco for OTOCO orders). Must be omitted when orderType is dca."
                  },
                  "jlMint": {
                    "type": "string",
                    "description": "For Earn While You Wait DCA orders only. The Jupiter Lend earn token for the input stablecoin (from GET /lend/v1/earn/tokens). Crafts a deposit into Jupiter Lend; the response returns jlTokenAccount instead of inputTokenAccount."
                  }
                },
                "required": [
                  "inputMint",
                  "outputMint",
                  "userAddress",
                  "amount",
                  "orderType"
                ]
              },
              "example": {
                "inputMint": "So11111111111111111111111111111111111111112",
                "outputMint": "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",
                "userAddress": "BQ72nSv9f3PRyRKCBnHLVrerrv37CYTHm5h3s9VSGQDV",
                "amount": "1000000000",
                "orderType": "price",
                "orderSubType": "single"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Unsigned deposit transaction",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "transaction": {
                      "type": "string",
                      "description": "Base64-encoded unsigned transaction"
                    },
                    "requestId": {
                      "type": "string",
                      "description": "Deposit request ID (used when creating the order)"
                    },
                    "receiverAddress": {
                      "type": "string",
                      "description": "Vault public key receiving the deposit"
                    },
                    "mint": {
                      "type": "string",
                      "description": "Token mint being deposited"
                    },
                    "amount": {
                      "type": "string",
                      "description": "Deposit amount in smallest unit"
                    },
                    "tokenDecimals": {
                      "type": "number",
                      "description": "Token decimals"
                    },
                    "inputTokenAccount": {
                      "type": "string",
                      "description": "Deterministic per-order input token account. Returned for deposits crafted with an orderSubType."
                    },
                    "outputTokenAccount": {
                      "type": "string",
                      "description": "Deterministic per-order output token account. Returned only when orderSubType is otoco."
                    },
                    "jlTokenAccount": {
                      "type": "string",
                      "description": "Jupiter Lend position account. Returned instead of inputTokenAccount when the deposit is crafted with jlMint (Earn While You Wait)."
                    }
                  },
                  "required": [
                    "transaction",
                    "requestId",
                    "receiverAddress",
                    "mint",
                    "amount",
                    "tokenDecimals"
                  ]
                },
                "example": {
                  "transaction": "AQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAEN...",
                  "requestId": "01234567-89ab-cdef-0123-456789abcdef",
                  "receiverAddress": "7nE9GJoYHNmtaQvTQpota3KV2oz4pQ2dA6nvYK8EUJHV",
                  "mint": "So11111111111111111111111111111111111111112",
                  "amount": "1000000000",
                  "tokenDecimals": 9,
                  "inputTokenAccount": "InputTokenAccountPubkey..."
                }
              }
            }
          },
          "400": {
            "description": "Invalid request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TriggerV2_ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "User address mismatch or no vault registered"
          }
        },
        "tags": [
          "TriggerV2"
        ]
      },
      "servers": [
        {
          "url": "https://api.jup.ag"
        }
      ]
    },
    "/trigger/v2/orders/price": {
      "post": {
        "summary": "Create price order",
        "description": "Create a new price order. Supports three order types:\n- `single`: triggers when price crosses above/below threshold\n- `oco`: one-cancels-other (take-profit + stop-loss pair)\n- `otoco`: parent trigger activates a TP/SL pair on fill\n",
        "security": [
          {
            "TriggerV2_ApiKeyAuth": [],
            "TriggerV2_BearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "orderType": {
                    "type": "string",
                    "enum": [
                      "single",
                      "oco",
                      "otoco"
                    ]
                  },
                  "depositRequestId": {
                    "type": "string",
                    "description": "From /deposit/craft response"
                  },
                  "depositSignedTx": {
                    "type": "string",
                    "description": "Base64-encoded signed deposit transaction"
                  },
                  "userPubkey": {
                    "type": "string"
                  },
                  "inputMint": {
                    "type": "string"
                  },
                  "inputAmount": {
                    "type": "string",
                    "description": "Amount in smallest unit"
                  },
                  "outputMint": {
                    "type": "string"
                  },
                  "triggerMint": {
                    "type": "string",
                    "description": "Token mint to monitor for price"
                  },
                  "triggerCondition": {
                    "type": "string",
                    "enum": [
                      "above",
                      "below"
                    ],
                    "description": "Single/OTOCO only"
                  },
                  "triggerPriceUsd": {
                    "type": "number",
                    "description": "Single/OTOCO trigger price. For single orders, required unless trailingBps is set."
                  },
                  "trailingBps": {
                    "type": "number",
                    "minimum": 50,
                    "maximum": 9000,
                    "description": "Trailing stop loss trail distance in basis points (50-9000). Single orders only; set instead of triggerPriceUsd. Direction from triggerCondition: below = sell-below (triggerMint === inputMint), above = buy-above (triggerMint === outputMint)."
                  },
                  "slippageBps": {
                    "type": "number",
                    "description": "Slippage tolerance (0-10000 bps)"
                  },
                  "tpPriceUsd": {
                    "type": "number",
                    "description": "Take-profit price (OCO/OTOCO)"
                  },
                  "slPriceUsd": {
                    "type": "number",
                    "description": "Stop-loss price (OCO/OTOCO)"
                  },
                  "tpSlippageBps": {
                    "type": "number",
                    "description": "Take-profit slippage (OCO/OTOCO)"
                  },
                  "slSlippageBps": {
                    "type": "number",
                    "description": "Stop-loss slippage (OCO/OTOCO)"
                  },
                  "expiresAt": {
                    "type": "number",
                    "description": "Expiration timestamp (milliseconds)"
                  }
                },
                "required": [
                  "orderType",
                  "depositRequestId",
                  "depositSignedTx",
                  "userPubkey",
                  "inputMint",
                  "inputAmount",
                  "outputMint",
                  "triggerMint",
                  "expiresAt"
                ]
              },
              "example": {
                "orderType": "single",
                "depositRequestId": "01234567-89ab-cdef-0123-456789abcdef",
                "depositSignedTx": "AQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAEN...",
                "userPubkey": "BQ72nSv9f3PRyRKCBnHLVrerrv37CYTHm5h3s9VSGQDV",
                "inputMint": "So11111111111111111111111111111111111111112",
                "inputAmount": "1000000000",
                "outputMint": "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",
                "triggerMint": "So11111111111111111111111111111111111111112",
                "triggerCondition": "above",
                "triggerPriceUsd": 200,
                "slippageBps": 100,
                "expiresAt": 1735689600000
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Order created",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TriggerV2_OrderResponse"
                },
                "example": {
                  "id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
                  "txSignature": "5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d...",
                  "depositConfirmed": true
                }
              }
            }
          },
          "400": {
            "description": "Validation error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TriggerV2_ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          }
        },
        "tags": [
          "TriggerV2"
        ]
      },
      "servers": [
        {
          "url": "https://api.jup.ag"
        }
      ]
    },
